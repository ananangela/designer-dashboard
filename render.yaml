services:
  - type: web
    name: designer-dashboard
    runtime: python
    runtimeVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
